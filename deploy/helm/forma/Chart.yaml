apiVersion: v2
name: forma
description: A Helm chart for Forma (the Go server and its job worker) with PostgreSQL, Valkey and SpiceDB
type: application
# Helm chart Version
version: 0.0.0-dev
# No appVersion: the image deployed is deployment.image.tag (or digest), which must be set.
icon: https://forma.yldm.ai/favicon.ico
keywords:
  - forma
  - postgresql
  - valkey
home: https://forma.yldm.ai
maintainers:
  - name: Forma
    email: info@forma.yldm.ai
dependencies:
  - name: spicedb-operator
    alias: spicedbOperator
    version: "0.1.0"
    repository: "file://../spicedb-operator"
    condition: authzed.operator.install
  - name: postgresql
    version: "16.4.16"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: gateway-helm
    alias: envoy
    version: "v1.7.1"
    repository: "oci://docker.io/envoyproxy"
    condition: envoy.controller.enabled
  - name: redis
    alias: envoyRedis
    version: 20.11.2
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: envoyRedis.enabled
  - name: vllm-stack
    alias: llm
    version: "0.1.11"
    repository: "https://vllm-project.github.io/production-stack"
    condition: llm.enabled
