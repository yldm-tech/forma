# Local dependencies for `make dev`. Services are added here as the modules that need them land (Valkey with sessions in P1, SpiceDB with authorization in P1).
services:
  postgres:
    image: postgres:18
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=forma
      - POSTGRES_USER=forma
      - POSTGRES_PASSWORD=forma
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres:
