# Local dependencies for `make dev-server` and `make dev-worker`. Services are added here as the modules that need them land.
services:
  postgres:
    image: postgres:18
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=forma
      - POSTGRES_USER=forma
      - POSTGRES_PASSWORD=forma
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Rate-limit counters. Same version the Go tests run (server/internal/platform/valkey/valkeytest).
  valkey:
    image: valkey/valkey:8.1
    ports:
      - ${VALKEY_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # SpiceDB keeps its relationships in a database of its own on the same PostgreSQL; this creates it on first start.
  spicedb-db:
    image: postgres:18
    restart: "no"
    environment:
      - PGPASSWORD=forma
    entrypoint:
      - sh
      - -c
      - psql -h postgres -U forma -d forma -tAc "SELECT 1 FROM pg_database WHERE datname = 'spicedb'" | grep -q 1 || psql -h postgres -U forma -d forma -c "CREATE DATABASE spicedb"
    depends_on:
      postgres:
        condition: service_healthy

  spicedb-migrate:
    image: authzed/spicedb:v1.52.0
    restart: "no"
    command: datastore migrate head
    environment:
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=postgresql://forma:forma@postgres:5432/spicedb?sslmode=disable
    depends_on:
      spicedb-db:
        condition: service_completed_successfully

  # Authorization. Same version the Go tests run (server/internal/authz/spicedbtest). It starts without a schema: `make authz-schema` (part of `make deps-up`) writes authzed/schema.zed.
  spicedb:
    image: authzed/spicedb:v1.52.0
    command: serve
    environment:
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=postgresql://forma:forma@postgres:5432/spicedb?sslmode=disable
      - SPICEDB_GRPC_PRESHARED_KEY=${AUTHZED_TOKEN:-forma-dev-token}
      - SPICEDB_TELEMETRY_ENDPOINT=
    ports:
      - 127.0.0.1:${SPICEDB_GRPC_PORT:-50051}:50051
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # File storage. Same release the Go tests run (server/internal/storage/s3test), forma2's. RustFS runs as uid 10001, so the data volume is handed to it first.
  rustfs-perms:
    image: busybox:1.36.1
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - rustfs-data:/data

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0
    command: /data
    environment:
      - RUSTFS_ACCESS_KEY=devrustfs
      - RUSTFS_SECRET_KEY=devrustfs123
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001
    ports:
      - ${RUSTFS_PORT:-9000}:9000
      - 127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001
    volumes:
      - rustfs-data:/data
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully

  # Creates the forma bucket, its CORS rule (browsers upload straight to it), and the service account .env.example uses. It is idempotent and runs on demand, from `make deps-up`: `docker compose run --rm rustfs-init`.
  rustfs-init:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    profiles: ["init"]
    restart: "no"
    environment:
      - RUSTFS_ADMIN_USER=devrustfs
      - RUSTFS_ADMIN_PASSWORD=devrustfs123
      - RUSTFS_BUCKET_NAME=forma
      - RUSTFS_POLICY_NAME=forma-policy
      - RUSTFS_SERVICE_USER=devrustfs-service
      - RUSTFS_SERVICE_PASSWORD=devrustfs-service123
      - RUSTFS_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./docker/rustfs-init.sh:/usr/local/bin/rustfs-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/rustfs-init.sh"]
    depends_on:
      - rustfs

volumes:
  postgres:
  rustfs-data:
