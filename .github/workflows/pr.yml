name: PR Update

# Update permissions to include all necessary ones
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
  id-token: write

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  lint:
    name: Run Linters
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  typecheck:
    name: Run Typecheck
    uses: ./.github/workflows/typecheck.yml

  # NOTE: there is deliberately no standalone "build the web app" job here. It used to run
  # `pnpm build --filter=@forma/web...` in parallel with the E2E job, which builds the very
  # same app, and cached the output into a key nothing downstream ever read. The compile
  # signal is covered by docker-build-validation.yml, which builds the app in production
  # config, and by typecheck.

  helm-chart-validation:
    name: Validate Helm Chart
    uses: ./.github/workflows/helm-chart-validation.yml

  coderabbit-config-validation:
    name: Validate CodeRabbit Config
    uses: ./.github/workflows/coderabbit-config-validation.yml

  # e2e.yml is deliberately not wired in here. It declares ENTERPRISE_LICENSE_KEY as a required
  # secret, so without one the call fails during validation — in about two seconds, before a single
  # step runs — and `required` below treats that as a failed gate on every PR. This organisation has
  # no enterprise licence yet. The workflow itself is kept, and still has its workflow_dispatch
  # trigger, so adding the secret and restoring the job below is all it takes to put the gate back.
  # Until then the browser-level journeys are unverified by CI.

  validate-authzed-schema:
    name: Validate AuthZed Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate schema assertions
        run: bash authzed/validate.sh

  # No `paths:` filter, deliberately: `required` below fails on a skipped job, and a required check
  # that never reports would keep every PR out of the merge queue.
  api-v3-contract-tests:
    name: Run API v3 Contract Tests
    uses: ./.github/workflows/api-v3-contract-tests.yml
    # Named rather than `inherit`: this job builds and runs PR-head code, and the licence is the only
    # secret it declares. Inheriting would hand it every other repository and organisation secret too.
    secrets:
      ENTERPRISE_LICENSE_KEY: ${{ secrets.ENTERPRISE_LICENSE_KEY }}

  required:
    name: PR Check Summary
    needs:
      [
        lint,
        typecheck,
        test,
        helm-chart-validation,
        coderabbit-config-validation,
        validate-authzed-schema,
        api-v3-contract-tests,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      statuses: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: fail if conditional jobs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')
        run: exit 1
