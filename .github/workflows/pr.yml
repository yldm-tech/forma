name: PR Update

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the jobs below this change needs. On a pull request it classifies the files the merge commit changes against its first parent, the base branch; on merge_group and workflow_dispatch it turns every output on. Each gated job skips itself when its output is false, and the summary at the end accepts that skip only then. Validate Translations and Validate CodeRabbit Config always run (their workflows say why).
  #
  # Nothing runs the skipped jobs later: the repository has no merge queue, so merge_group never fires, no workflow runs this suite on pushes to main, and release.yml publishes the images from the merge commit as it lands. A job skipped here has not run on the change at all before it ships, so the cases below must list every path a gated job reads. A Go job that reads a file outside apps/server, or a TypeScript check that reads one inside it, must add that path to the matching case, or a change to it alone would skip the check that reads it.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      ts: ${{ steps.classify.outputs.ts }}
      authzed: ${{ steps.classify.outputs.authzed }}
      helm: ${{ steps.classify.outputs.helm }}
      docker: ${{ steps.classify.outputs.docker }}
      website: ${{ steps.classify.outputs.website }}
      npm: ${{ steps.classify.outputs.npm }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Two commits deep: on a pull request the checkout is the merge commit, whose first parent is the base branch.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          outputs=(go ts authzed helm docker website npm)
          declare -A on=()
          all() { for output in "${outputs[@]}"; do on[$output]=1; done; }

          if [ "$EVENT" != "pull_request" ]; then
            all
          else
            # Fails closed: without the merge commit there is no base to diff against, and a failed classification fails the summary.
            git rev-parse --verify --quiet HEAD^2 >/dev/null || { echo "::error::HEAD is not the pull request's merge commit."; exit 1; }
            changed="${RUNNER_TEMP}/changed-files"
            git diff --no-renames --name-only -z HEAD^1 HEAD > "$changed"
            while IFS= read -r -d '' path; do
              echo "$path"
              # Shared by every part of the repository: the workflows themselves (which Go and TypeScript tests also read), the dependency graph and the tooling.
              case "$path" in
                .github/* | pnpm-lock.yaml | pnpm-workspace.yaml | tooling/*) all ;;
              esac
              # The Go module; the Makefile, whose GOLANGCI_LINT_VERSION the Go server job lints with; and what the Go tests read outside the module: the Docker deployment (forma.sh, the compose files, the Dockerfile), the language tables in packages/i18n-utils, the survey runtime's locales, and apps/web's locales, public files and survey page.
              case "$path" in
                apps/server/* | Makefile | deploy/docker/* | packages/i18n-utils/src/* | packages/surveys/locales/* | apps/web/locales/* | apps/web/public/* | apps/web/survey.html) on[go]=1 ;;
              esac
              # `vp check` formats and lints every file outside apps/server, so any of them; inside it, the migrations and Squawk config the migration lint reads, the JSON Schemas the export check compares, the tag handler a website test reads, and any TypeScript test file, which the orphaned test check exists to catch.
              case "$path" in
                apps/server/migrations/* | apps/server/.squawk.toml | apps/server/internal/jsonschema/* | apps/server/internal/tag/handler.go | *.test.ts | *.test.tsx | *.spec.ts | *.spec.tsx) on[ts]=1 ;;
                apps/server/*) ;;
                *) on[ts]=1 ;;
              esac
              case "$path" in
                apps/server/authzed/*) on[authzed]=1 ;;
              esac
              case "$path" in
                deploy/helm/*) on[helm]=1 ;;
              esac
              # The Forma image: what deploy/docker/Dockerfile copies into the build, the build context's ignore file, and the compose stack the validation boots.
              case "$path" in
                package.json | pnpm-lock.yaml | pnpm-workspace.yaml | vite.config.ts | .node-version | .dockerignore | patches/* | apps/storybook/* | apps/web/* | packages/* | tooling/typescript/* | tooling/vite-plugins/* | apps/server/* | deploy/docker/*) on[docker]=1 ;;
              esac
              # The website image: what apps/website/Dockerfile copies.
              case "$path" in
                package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .node-version | .dockerignore | patches/* | tooling/typescript/* | apps/website/*) on[website]=1 ;;
              esac
              # The npm dependency graph pnpm audit reads (the Go scan of the dependency audit follows the go output).
              case "$path" in
                package.json | */package.json | pnpm-lock.yaml | pnpm-workspace.yaml | patches/*) on[npm]=1 ;;
              esac
            done < "$changed"
          fi

          for output in "${outputs[@]}"; do
            value=false
            if [ -n "${on[$output]:-}" ]; then value=true; fi
            echo "${output}=${value}" | tee -a "$GITHUB_OUTPUT"
          done

  server:
    name: Go server
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Verify wire_gen.go is up to date
        run: |
          go tool wire ./internal/app
          git diff --exit-code -- internal/app/wire_gen.go

      # The Makefile's GOLANGCI_LINT_VERSION is the one pin, which `make lint` also checks the local binary against; the action wants it with a leading v.
      - name: Read the golangci-lint version from the Makefile
        id: golangci-lint
        working-directory: .
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^GOLANGCI_LINT_VERSION[[:space:]]*:?=[[:space:]]*v?([0-9][0-9.]*)[[:space:]]*$/\1/p' Makefile)"
          if [ -z "$version" ] || [ "$(wc -l <<<"$version")" -ne 1 ]; then
            echo "::error file=Makefile::Expected exactly one GOLANGCI_LINT_VERSION := <x.y.z> line."
            exit 1
          fi
          echo "version=v${version}" | tee -a "$GITHUB_OUTPUT"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint.outputs.version }}
          working-directory: apps/server

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/forma

  # The race-detector suite runs in parallel shards. auth and apikey each get one: their tests hash at bcrypt's production cost, which the race detector slows to several minutes per package, and run alongside the rest they outgrew go test's 10-minute default. The other packages alternate between two shards.
  server-test:
    name: Go tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [auth, apikey, rest-1, rest-2]
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          module=$(go list -m)
          case "$SHARD" in
            auth) packages=("$module/internal/auth") ;;
            apikey) packages=("$module/internal/apikey") ;;
            rest-*)
              half=${SHARD#rest-}
              mapfile -t packages < <(go list ./... | grep -vxF -e "$module/internal/auth" -e "$module/internal/apikey" | awk -v half="$half" 'NR % 2 == half % 2')
              ;;
          esac
          go test -race -timeout 20m "${packages[@]}"

  workspace:
    name: TypeScript workspace
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Two commits deep: on a pull request the checkout is the merge commit, whose first parent is the base branch, which is what the migration lint diffs against.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # Installs Vite+ (version from the pnpm catalog), Node.js from .node-version and pnpm from packageManager, then runs `vp install` against the frozen lockfile.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: ".node-version"
          cache: true

      # Built first: type-aware checks resolve sibling packages through their dist/ declarations.
      - name: Build
        run: vp run -r build

      # Lint and type-check skip the stories on the grounds that Storybook compiles them (vite.config.ts), and `vp run -r build` does not build Storybook, so this is the step that does. A `--filter` that matches no package exits 0 ("No packages matched the filter"), so the step also checks that the build wrote the site.
      - name: Build Storybook
        run: |
          vp run --filter @forma/storybook build-storybook
          test -f apps/storybook/storybook-static/index.html

      - name: Verify the TanStack Router route tree is committed
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

      # The bundles and the survey page every respondent downloads, weighed right after the build that produced them (tooling/scripts/check-bundle-budget.mjs).
      - name: Check the SDK bundle budgets
        run: vp run bundle:check

      # Squawk on the goose migrations this change adds or edits, Up sections only (tooling/scripts/lint-migrations.sh, apps/server/.squawk.toml). Shipped migrations are never edited, so they are never linted.
      - name: Lint added or changed migrations
        run: bash tooling/scripts/lint-migrations.sh

      - name: Catalog, orphaned test and exported JSON Schema checks
        run: |
          vp run catalog:check
          vp run tests:run-check
          vp run --filter @forma/types export-json-schema -- --check

      - name: Format, lint and type-check
        run: vp check

      - name: Test
        run: vp run -r test

  # forma2 held its authentication and authorization code to 80% statement coverage (test.yml). The same packages here are auth, authz and apikey; on 2026-10-23 they stood at 85.7%, 87.8% and 89.7%. Without the race detector, which the shards above already run them under, the three took about 25 seconds side by side on a development machine.
  server-coverage:
    name: Go coverage (auth, authz, apikey)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Check statement coverage
        env:
          MIN_COVERAGE: "80"
        run: |
          set -euo pipefail
          go test -count=1 -cover ./internal/auth ./internal/authz ./internal/apikey | tee coverage.txt
          status=0
          for pkg in auth authz apikey; do
            pct=$(awk -v pkg="internal/${pkg}" '$1 == "ok" && $2 ~ pkg"$" { for (i = 1; i <= NF; i++) if ($i == "coverage:") { sub("%", "", $(i + 1)); print $(i + 1) } }' coverage.txt)
            if [ -z "${pct}" ]; then
              echo "::error::No coverage reported for internal/${pkg}."
              status=1
            elif awk -v pct="${pct}" -v min="${MIN_COVERAGE}" 'BEGIN { exit !(pct < min) }'; then
              echo "::error::internal/${pkg} statement coverage is ${pct}%, below the ${MIN_COVERAGE}% floor."
              status=1
            else
              echo "internal/${pkg}: ${pct}% (floor ${MIN_COVERAGE}%)"
            fi
          done
          exit "${status}"

  translations:
    name: Validate Translations
    uses: ./.github/workflows/translation-check.yml

  validate-authzed-schema:
    name: Validate AuthZed Schema
    needs: changes
    if: needs.changes.outputs.authzed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate schema assertions
        run: bash apps/server/authzed/validate.sh

  helm-chart-validation:
    name: Validate Helm Chart
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    uses: ./.github/workflows/helm-chart-validation.yml

  coderabbit-config-validation:
    name: Validate CodeRabbit Config
    uses: ./.github/workflows/coderabbit-config-validation.yml

  # Each image is built only when something it is built from changed; the called workflow skips the other.
  docker-build-validation:
    name: Docker
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/docker-build-validation.yml
    with:
      forma-image: ${{ needs.changes.outputs.docker == 'true' }}
      website-image: ${{ needs.changes.outputs.website == 'true' }}

  # govulncheck when the Go server changes, pnpm audit when the npm dependencies do; the called workflow skips the other. Its fetches cannot fail it (dependency-audit.yml).
  dependency-audit:
    name: Dependency Audit
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.npm == 'true'
    uses: ./.github/workflows/dependency-audit.yml
    with:
      go: ${{ needs.changes.outputs.go == 'true' }}
      npm: ${{ needs.changes.outputs.npm == 'true' }}

  required:
    name: PR Check Summary
    needs:
      - changes
      - server
      - server-test
      - server-coverage
      - workspace
      - translations
      - validate-authzed-schema
      - helm-chart-validation
      - coderabbit-config-validation
      - docker-build-validation
      - dependency-audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Every job must succeed, except that a gated job may be skipped when the changes job succeeded and set its output to false. Any other skip (the changes job failed or was cancelled, or a job skipped for another reason) counts as a failure, as does a cancelled job, so a job that never ran cannot pass the gate.
      - name: Fail if any required job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          declare -A gate=(
            [server]=go
            [server-test]=go
            [server-coverage]=go
            [workspace]=ts
            [validate-authzed-schema]=authzed
            [helm-chart-validation]=helm
          )
          result() { jq -r --arg job "$1" '.[$job].result' <<<"$NEEDS"; }
          output() { jq -r --arg name "$1" '.changes.outputs[$name] // "unset"' <<<"$NEEDS"; }

          if [ "$(result changes)" != "success" ]; then
            echo "::error::changes: $(result changes)"
            exit 1
          fi

          status=0
          for job in $(jq -r 'keys[] | select(. != "changes")' <<<"$NEEDS"); do
            outcome="$(result "$job")"
            if [ "$outcome" = "success" ]; then
              echo "${job}: success"
              continue
            fi
            if [ "$outcome" = "skipped" ]; then
              if [ "$job" = "docker-build-validation" ]; then
                skippable=$([ "$(output docker)" = "false" ] && [ "$(output website)" = "false" ] && echo yes || echo no)
              elif [ "$job" = "dependency-audit" ]; then
                skippable=$([ "$(output go)" = "false" ] && [ "$(output npm)" = "false" ] && echo yes || echo no)
              elif [ -n "${gate[$job]:-}" ]; then
                skippable=$([ "$(output "${gate[$job]}")" = "false" ] && echo yes || echo no)
              else
                skippable=no
              fi
              if [ "$skippable" = "yes" ]; then
                echo "${job}: skipped, nothing it checks changed"
                continue
              fi
            fi
            echo "::error::${job}: ${outcome}"
            status=1
          done
          exit "$status"
