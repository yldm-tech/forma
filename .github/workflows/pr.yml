name: PR Update

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    # A change to a shared package invalidates the whole Go test cache, and the full `go test -race` run (bcrypt at production cost, testcontainers per package) takes longer than 15 minutes on a hosted runner.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify wire_gen.go is up to date
        run: |
          go tool wire ./internal/app
          git diff --exit-code -- internal/app/wire_gen.go

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: server

      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/forma

  workspace:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Vite+ (version from the pnpm catalog), Node.js from .node-version and pnpm from packageManager, then runs `vp install` against the frozen lockfile.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true

      # Built first: type-aware checks resolve sibling packages through their dist/ declarations.
      - name: Build
        run: vp run -r build

      - name: Verify the TanStack Router route tree is committed
        run: git diff --exit-code -- web/src/routeTree.gen.ts

      - name: Catalog, OpenAPI and exported JSON Schema checks
        run: |
          vp run catalog:check
          vp run api:v3:lint
          vp run --filter @forma/types export-json-schema -- --check

      - name: Format, lint and type-check
        run: vp check

      - name: Test
        run: vp run -r test

  validate-authzed-schema:
    name: Validate AuthZed Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate schema assertions
        run: bash authzed/validate.sh

  helm-chart-validation:
    name: Validate Helm Chart
    uses: ./.github/workflows/helm-chart-validation.yml

  coderabbit-config-validation:
    name: Validate CodeRabbit Config
    uses: ./.github/workflows/coderabbit-config-validation.yml

  required:
    name: PR Check Summary
    needs: [server, workspace, validate-authzed-schema, helm-chart-validation, coderabbit-config-validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # A skipped or cancelled dependency counts as a failure, so a job that never ran cannot pass the gate.
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')
        run: exit 1
