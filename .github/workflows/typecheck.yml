name: Typecheck
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dangerous-git-checkout

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64

      # apps/web's typegen and @forma/database's build (both in the
      # typecheck task graph) read variables from the root .env.
      - name: Create .env
        run: pnpm dev:setup

      # Restore only — warm-turbo-cache.yml is the producer, on push to main. This is the first consumer
      # wired up on purpose: read the `cache hit`/`cache miss` lines in the turbo output below before
      # adding the same step to lint.yml, test.yml, integration-tests.yml and api-v3-contract-tests.yml.
      # A PR that touches only apps/web should report every build task in this graph as a hit.
      #
      # DATABASE_URL stays out of this job's environment, as it already is: `@forma/database#build` and
      # `#generate` hash it (turbo.json), so setting it here would miss every entry the producer wrote.
      #
      # Branch-scoped, like every Actions cache: merge_group runs happen on throwaway
      # `gh-readonly-queue/...` branches and will miss, the same caveat e2e.yml records for its
      # Playwright browser cache.
      - name: Restore the Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Typecheck
        run: pnpm typecheck
