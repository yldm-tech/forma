name: Release

# Publishes the container image the cluster deploys. Nothing published one before this: the only
# `ghcr.io/yldm-tech/forma` reference in CI was a local `docker tag` inside the build validation,
# which runs with `push: false`.
#
# Triggered on the push rather than chained off a successful CI run, because no workflow in this
# repository runs on pushes to main — the gate in `pr.yml` is `pull_request` and `merge_group`, so
# the merge commit has already been through it by the time it lands here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      # Monotonic, so a retried run republishes the same version from the same commit rather than
      # minting a new one. Matches how the other services in yldm-platform are tagged, which is
      # what `images.newTag` in their kustomization pins.
      VERSION: 0.1.${{ github.run_number }}
      RELEASE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Reserve immutable release tag
        shell: bash
        run: |
          # A rerun must resolve to the commit it first published, never a different one.
          tag="v$VERSION"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            [ "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA" ] || {
              echo "::error::$tag already points at a different commit"
              exit 1
            }
          else
            git tag "$tag" "$RELEASE_SHA"
            git push origin "refs/tags/$tag"
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/yldm-tech/forma:${{ env.VERSION }}
            ghcr.io/yldm-tech/forma:sha-${{ github.sha }}
          # `image.source` is not decoration: the github-deploy-tracker CronWorkflow in the cluster
          # resolves an image back to its repository from this label, which is how a rollout becomes
          # a GitHub Deployment status without naming the repo in yldm-platform.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          provenance: false

      - name: Move latest and publish the release
        shell: bash
        run: |
          image="ghcr.io/yldm-tech/forma"
          # A slow run of an older commit must not roll `latest` backwards.
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$RELEASE_SHA" ]; then
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          fi

          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes --latest=false
          fi

          {
            echo "## Published $VERSION"
            echo "Source: $RELEASE_SHA"
            echo "- \`$image:$VERSION\`"
            echo "- \`$image:sha-$RELEASE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
