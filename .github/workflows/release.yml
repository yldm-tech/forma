name: Release

# Publishes the container image the cluster deploys, tagged <version>, sha-<commit> and latest, built from the repository's deploy/docker/Dockerfile (the Go binary with the SPA embedded) for linux/amd64 and linux/arm64, as ghcr.io/yldm-tech/forma-server. The marketing site on forma.yldm.ai's root is a second image, ghcr.io/yldm-tech/forma-website, published by a job of its own so that it never holds back a release.
#
# Triggered on the push rather than chained off a successful CI run, because no workflow in this repository runs on pushes to main. The gate is the `main: required checks` ruleset: a pull request merges only once `PR Check Summary` (pr.yml) and `PR title` pass on it. The ruleset does not require the branch to be up to date and there is no merge queue (pr.yml's `merge_group` trigger never fires), so what was checked is the pull request merged into main as main stood at its last run, not the merge commit that lands here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      # Monotonic, so a retried run republishes the same version from the same commit rather than minting a new one. Versions are 0.2.<run>; the retired Next.js release used 0.1.<run>, so no version names two builds.
      VERSION: 0.2.${{ github.run_number }}
      IMAGE: ghcr.io/yldm-tech/forma-server
      RELEASE_SHA: ${{ github.sha }}
      # `latest` is what deploy/docker/docker-compose.yml pulls, and it moves together with the `stable` branch: deploy/docker/forma.sh downloads deploy/docker/ from `stable`, so `stable` always describes the image `latest` names. Moving both is opt-in: they move only while the repository variable RELEASE_MOVE_LATEST is true.
      MOVE_LATEST: ${{ vars.RELEASE_MOVE_LATEST }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      # An organization package only accepts pushes from the workflows of the repositories listed under its "Manage Actions access" (github.com/orgs/yldm-tech/packages/container/<name>/settings). forma-server and forma-website (the `website` job below) are created by this workflow's first push, which links them to this repository and grants it access; the image has a name of its own because ghcr.io/yldm-tech/forma belonged to the retired Next.js release's workflow and refused this one (`denied: permission_denied: write_package`); that package was deleted on 2026-10-25.
      # A package the first push creates is private: it inherits the repository's access but not its visibility. Self-hosters pull forma-server without credentials, so after the first successful run, and before RELEASE_MOVE_LATEST is set to true, an org admin sets ghcr.io/yldm-tech/forma-server to Public (its package settings, Danger Zone > Change visibility); the last step refuses to move `stable` and `latest` until an anonymous pull of the release works. forma-website only needs the same when something without a pull secret is to pull it.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Before anything is pushed: a version is immutable. A rerun of the same run number may republish it from the commit it first published, and nothing else may overwrite it.
      - name: Refuse to overwrite a published version
        shell: bash
        run: |
          tag="v$VERSION"
          if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n 1 "$tag")" != "$RELEASE_SHA" ]; then
              echo "::error::$tag already points at a different commit"
              exit 1
            fi
          elif published=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            # An earlier attempt pushed the image and failed before the tag. The sha- tag it pushed alongside names the commit, so this commit may finish its own release; any other commit is refused.
            if [ "$(docker buildx imagetools inspect "$IMAGE:sha-$RELEASE_SHA" --format '{{.Manifest.Digest}}' 2>/dev/null)" != "$published" ]; then
              echo "::error::$IMAGE:$VERSION is already published, but neither a $tag tag nor $IMAGE:sha-$RELEASE_SHA says it came from this commit"
              exit 1
            fi
          fi

      # Both build stages run on the runner's own platform and Go cross-compiles, so the arm64 image needs no emulation.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The layers this push builds seed the next release's build of this image. A pull request's cache can read its base branch's, so a workflow that builds this Dockerfile with `cache-from: type=gha,scope=forma-image` would reuse them too; none does yet. mode=max keeps the web and server stages too, which is where the time goes; only layers are exported, not the contents of RUN --mount=type=cache.
          cache-from: type=gha,scope=forma-image
          cache-to: type=gha,mode=max,scope=forma-image
          # Stamped into the binary (buildinfo.Version), so telemetry, Sentry and the usage report name the release.
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # `image.source` is not decoration: the github-deploy-tracker CronWorkflow in the cluster resolves an image back to its repository from this label, which is how a rollout becomes a GitHub Deployment status without naming the repo in yldm-platform.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          provenance: false

      # After the build, not before, so a run that fails to build leaves no tag pointing at a commit that never produced an image. The concurrency group serialises runs, so nothing is racing for the name.
      - name: Tag the published commit
        shell: bash
        run: |
          tag="v$VERSION"
          if ! git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$RELEASE_SHA"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish the release and move stable and latest
        shell: bash
        env:
          # GitHub refuses to let a token without the `workflows` permission move a branch across commits that change .github/workflows/, and the job's own token can never hold that permission, so most `stable` updates need another token. RELEASE_STABLE_TOKEN is a fine-grained token (or a GitHub App token) for this repository with Contents and Workflows write; configure it before setting RELEASE_MOVE_LATEST. Without it the update falls back to the job's token, and a refusal fails the step before `latest` moves.
          STABLE_TOKEN: ${{ secrets.RELEASE_STABLE_TOKEN || github.token }}
        run: |
          # First, so a refused `stable` update below still leaves the published version recorded: its image and tag already exist.
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes --latest=false
          fi

          {
            echo "## Published $VERSION"
            echo "Source: $RELEASE_SHA"
            echo "- \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64)"
            echo "- \`$IMAGE:sha-$RELEASE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # A slow run of an older commit must not roll `latest` backwards.
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$MOVE_LATEST" != "true" ] || [ "$current" != "$RELEASE_SHA" ]; then
            echo "- \`$IMAGE:latest\` was left alone (RELEASE_MOVE_LATEST is not true, or main has moved on)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Self-hosters pull $IMAGE without credentials (the compose file `stable` hands them pulls $IMAGE:latest), and GHCR creates a package private on its first push; a linked package inherits the repository's access, not its visibility. So neither moves until an anonymous client can fetch this version's manifest, as ghcr.io answers a private package: the pull token itself is refused with 403.
          repository=${IMAGE#ghcr.io/}
          if ! anonymous=$(curl -fsS "https://ghcr.io/token?scope=repository:$repository:pull" | jq -er .token) \
            || ! curl -fsS -o /dev/null -H "Authorization: Bearer $anonymous" -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" "https://ghcr.io/v2/$repository/manifests/$VERSION"; then
            echo "::error::An anonymous client cannot pull $IMAGE:$VERSION, so neither stable nor latest moved. An org admin makes the package public (https://github.com/orgs/${repository%%/*}/packages/container/${repository#*/}/settings, Danger Zone > Change visibility > Public), then reruns this job."
            exit 1
          fi

          # `stable` before `latest`: if either fails the step stops, and a `stable` ahead of `latest` only means the next `docker compose pull` is still to come, while a `latest` ahead of `stable` hands new images the previous release's deploy/docker/ files. A rerun repeats both, and both are idempotent.
          # `stable` is a commit on top of the release commit with the release's tree. Earlier releases also published deploy/docker/ under docker/ there, for the retired Next.js release's installer; that copy is no longer published, so the first release after it drops docker/ from `stable`, and the installer's downloads from stable/docker/ answer 404 instead of handing a forma2 installation a stack that cannot read its data.
          # The commit and the ref are written with the stable token, since GitHub may refuse either for want of the workflows permission.
          stable_failed() {
            echo "::error::$1, so latest was left alone. If GitHub refused it for want of the workflows permission, set the RELEASE_STABLE_TOKEN secret and rerun."
            exit 1
          }

          if stable=$(gh api "repos/$GH_REPO/git/ref/heads/stable" --jq .object.sha 2>/dev/null); then
            git cat-file -e "$stable^{commit}" 2>/dev/null || git fetch --quiet --no-tags origin "$stable"
          else
            stable=""
          fi

          for name in docker-compose.yml forma.sh authzed-postgres-bootstrap.sh; do
            if ! git cat-file -e "$RELEASE_SHA:deploy/docker/$name" 2>/dev/null; then
              echo "::error::$RELEASE_SHA has no deploy/docker/$name for forma.sh to download from stable, so latest was left alone."
              exit 1
            fi
          done
          tree=$(git rev-parse "$RELEASE_SHA^{tree}")

          if [ -n "$stable" ] && [ "$(git rev-parse "$stable^{tree}")" = "$tree" ]; then
            echo "- \`stable\` already carries this release" >> "$GITHUB_STEP_SUMMARY"
          else
            # Not forced: main only moves forward, so the update must be a fast-forward. A stable on main is one; the commit this step made for the previous release (which, for releases before the docker/ copy was dropped, also carries docker/) is made one by being the new commit's second parent. Anything else means something else moved stable, and it should fail loudly rather than be overwritten.
            parents=(-f "parents[]=$RELEASE_SHA")
            if [ -n "$stable" ] && ! git merge-base --is-ancestor "$stable" "$RELEASE_SHA"; then
              if git merge-base --is-ancestor "$stable^1" "$RELEASE_SHA" 2>/dev/null && git diff --quiet "$stable^1" "$stable" -- ':(exclude)docker'; then
                parents+=(-f "parents[]=$stable")
              else
                echo "::error::stable ($stable) is neither on main nor a release commit this workflow made on top of main, so something else moved it; latest was left alone."
                exit 1
              fi
            fi
            commit=$(GH_TOKEN="$STABLE_TOKEN" gh api -X POST "repos/$GH_REPO/git/commits" -f message="Release v$VERSION: $RELEASE_SHA" -f tree="$tree" "${parents[@]}" --jq .sha) || stable_failed "Could not create the stable commit for $RELEASE_SHA"

            if [ -n "$stable" ]; then
              update=(api -X PATCH "repos/$GH_REPO/git/refs/heads/stable" -f sha="$commit" -F force=false)
            else
              update=(api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/heads/stable -f sha="$commit")
            fi
            GH_TOKEN="$STABLE_TOKEN" gh "${update[@]}" >/dev/null || stable_failed "Could not move stable to $commit ($RELEASE_SHA)"
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          echo "- \`$IMAGE:latest\` and the \`stable\` branch now point here" >> "$GITHUB_STEP_SUMMARY"

  # The marketing site (apps/website): a second image from the same commit under the same version, in a job of its own rather than a step of the release. Nothing that gates a merge builds its Dockerfile (Validate Website Image is not a required check), so a broken website image must not stop the server's tag, release and `latest`; a failure here fails only this job, and the next push to main or a rerun of the job publishes it. It is not part of the Helm chart or deploy/docker/: self-hosters run the app and have no use for forma.yldm.ai's own site.
  website:
    name: Publish website image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: 0.2.${{ github.run_number }}
      WEBSITE_IMAGE: ghcr.io/yldm-tech/forma-website

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the website
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/website/Dockerfile
          push: true
          cache-from: type=gha,scope=forma-website
          cache-to: type=gha,mode=max,scope=forma-website
          tags: |
            ${{ env.WEBSITE_IMAGE }}:${{ env.VERSION }}
            ${{ env.WEBSITE_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          provenance: false

      - name: Summary
        shell: bash
        run: echo "- \`$WEBSITE_IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
