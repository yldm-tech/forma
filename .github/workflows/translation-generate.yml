name: Translation Generation

# Generates the non-English locales whenever a pull request changes an `en-US.json`, and commits the
# result back to the branch.
#
# `translation-check.yml` fails a pull request whose locales are out of sync, which is correct but leaves
# a contributor with no way forward: the other locales are machine-generated by Lingo.dev and that needs a
# key most contributors do not have. This workflow is the missing other half — it does what
# `pnpm i18n` does locally, so adding a string stays a one-file change.
#
# Skipped for forks, where secrets are unavailable by design, and skipped when no key is configured, so a
# repository without one behaves exactly as it did before rather than failing a job it cannot satisfy.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: translation-generate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-translations:
    name: Generate Translations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pushing the generated locales back to the pull request's own branch.
    permissions:
      contents: write
    # A fork's pull request cannot read secrets, so the generation would fail on authentication rather
    # than produce anything. `translation-check.yml` still tells that contributor what is missing.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # The generated locales are committed back, so the checkout keeps its push credentials.
          persist-credentials: true

      - name: Check whether a source catalogue changed
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/web/locales/en-US.json'
            surveys:
              - 'packages/surveys/locales/en-US.json'

      - name: Check whether a key is configured
        id: key
        env:
          LINGO_API_KEY: ${{ secrets.LINGO_API_KEY }}
        run: |
          if [ -n "${LINGO_API_KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No LINGO_API_KEY secret is set — skipping generation. Run \`pnpm i18n\` locally and commit the result." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install pnpm
        if: steps.key.outputs.configured == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.surveys == 'true')
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js (version from .nvmrc)
        if: steps.key.outputs.configured == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.surveys == 'true')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        if: steps.key.outputs.configured == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.surveys == 'true')
        run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64

      # Both `i18n:generate` scripts read the key through `dotenv -e ../../.env`, and `dev:setup` writes
      # the placeholder from `.env.example` — which would otherwise shadow the secret in the environment.
      - name: Create .env carrying the key
        if: steps.key.outputs.configured == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.surveys == 'true')
        env:
          LINGO_API_KEY: ${{ secrets.LINGO_API_KEY }}
        run: |
          pnpm dev:setup
          sed -i "s|^LINGO_API_KEY=.*|LINGO_API_KEY=${LINGO_API_KEY}|" .env
          grep -q '^LINGO_API_KEY=.\+' .env

      - name: Generate the survey runtime locales
        if: steps.key.outputs.configured == 'true' && steps.changes.outputs.surveys == 'true'
        run: pnpm i18n:surveys:generate

      - name: Generate the web app locales
        if: steps.key.outputs.configured == 'true' && steps.changes.outputs.web == 'true'
        run: pnpm i18n:web:generate

      # `.env` holds the key and is gitignored, so it cannot reach the commit; the guard below is for the
      # case where that ever stops being true.
      - name: Commit the generated locales
        if: steps.key.outputs.configured == 'true' && (steps.changes.outputs.web == 'true' || steps.changes.outputs.surveys == 'true')
        env:
          # Through the environment rather than interpolated into the script: a branch name is attacker-
          # controlled on a pull request and would otherwise be a shell injection.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git status --porcelain | grep -q '\.env'; then
            echo "Refusing to commit: .env is not ignored and holds the API key." >&2
            exit 1
          fi

          git add apps/web/locales packages/surveys/locales apps/web/i18n.lock packages/surveys/i18n.lock
          if git diff --cached --quiet; then
            echo "Locales were already in sync — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(i18n): regenerate locales from en-US"
          git push origin "HEAD:${HEAD_REF}"
          echo "Regenerated locales and pushed them to the branch." >> "$GITHUB_STEP_SUMMARY"

      - name: Skip (no source catalogue changed)
        if: steps.changes.outputs.web != 'true' && steps.changes.outputs.surveys != 'true'
        run: echo "No en-US catalogue changed — nothing to generate."
