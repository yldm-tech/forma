name: E2E Tests

# The Playwright browser suite (apps/e2e) against `forma start` with PostgreSQL, Valkey, SpiceDB and RustFS: sign-up and onboarding, a link survey published, answered and its response filtered and exported, an app survey shown by the SDK on a host page, an image uploaded in the survey editor, and WCAG AA checks with axe on the login page, the survey editor and a public survey page at a desktop and a phone viewport. Not a required check, as in forma2: it runs on demand and on pull requests that change what it drives.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/server/internal/webui/**"
      - "apps/server/internal/linksurvey/**"
      - "packages/surveys/**"
      - "packages/js-core/**"
      - "apps/e2e/**"
      - "tooling/scripts/ci-stack.sh"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true

      # The SPA and the SDK bundles, embedded in the binary as in the container image.
      - name: Build forma
        run: |
          vp run -r build
          make embed server

      - name: Install Chromium
        working-directory: apps/e2e
        run: vp exec playwright install --with-deps chromium

      - name: Start PostgreSQL, Valkey, SpiceDB, RustFS and forma
        env:
          FORMA_LOG: ${{ runner.temp }}/forma.log
        run: bash tooling/scripts/ci-stack.sh up

      - name: Run the browser suite
        working-directory: apps/e2e
        run: vp exec playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          if-no-files-found: ignore
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/

      - name: Upload the server log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-server-log
          if-no-files-found: ignore
          path: ${{ runner.temp }}/forma.log
