name: E2E Tests

# The Playwright browser suite (apps/e2e) against `forma start` with PostgreSQL, Valkey, SpiceDB and RustFS: sign-up and onboarding, a link survey published, answered and its response filtered and exported, an app survey shown by the SDK on a host page, an image uploaded in the survey editor, a workspace logo uploaded and a respondent's file uploaded on a survey page (these upload specs, tagged @upload, run a second time against a server started with STORAGE_UPLOAD_METHOD=put), and WCAG AA checks with axe on the login page, the survey editor and a public survey page at a desktop and a phone viewport. Not a required check, as in forma2: it runs on demand and on pull requests that change anything it builds, serves or boots, which is the SPA, the workspace packages and tooling it is built from, any server code outside tests, the dev stack's compose file, environment and RustFS init script, and the job's own inputs (Makefile, .node-version, this file).

on:
  workflow_dispatch:
  pull_request:
    # Order matters: a `!` entry excludes what the entries before it matched, and a later positive entry would match it again, so the server's test exclusions follow `apps/server/**` and nothing below them matches under apps/server/.
    paths:
      - "apps/web/**"
      - "apps/e2e/**"
      - "apps/server/**"
      - "!apps/server/**/*_test.go"
      - "!apps/server/**/testdata/**"
      - "packages/**"
      - "tooling/vite-plugins/**"
      - "tooling/typescript/**"
      - "tooling/scripts/ci-stack.sh"
      - "docker-compose.dev.yml"
      - ".env.example"
      - "deploy/docker/rustfs-init.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "patches/**"
      - "Makefile"
      - ".node-version"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: ".node-version"
          cache: true

      # The SPA and the SDK bundles, embedded in the binary as in the container image.
      - name: Build forma
        run: |
          vp run -r build
          make embed server

      - name: Install Chromium
        working-directory: apps/e2e
        run: vp exec playwright install --with-deps chromium

      - name: Start PostgreSQL, Valkey, SpiceDB, RustFS and forma
        env:
          FORMA_LOG: ${{ runner.temp }}/forma.log
        run: bash tooling/scripts/ci-stack.sh up

      - name: Run the browser suite
        working-directory: apps/e2e
        run: vp exec playwright test

      # The upload specs again, against a server that signs presigned PUT uploads (the method for stores without POST uploads, such as Cloudflare R2), on a fresh stack.
      - name: Restart the stack with presigned PUT uploads
        env:
          FORMA_LOG: ${{ runner.temp }}/forma-put.log
          STORAGE_UPLOAD_METHOD: put
        run: |
          bash tooling/scripts/ci-stack.sh down
          bash tooling/scripts/ci-stack.sh up

      - name: Run the upload specs with presigned PUT uploads
        working-directory: apps/e2e
        env:
          STORAGE_UPLOAD_METHOD: put
        run: vp exec playwright test --grep @upload

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          if-no-files-found: ignore
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/

      - name: Upload the server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-server-log
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/forma.log
            ${{ runner.temp }}/forma-put.log
