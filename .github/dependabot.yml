# Everything here is pinned (actions to a commit SHA, Go modules and compose images to exact versions or digests), so without this a security fix only lands when someone bumps a pin by hand. Weekly and grouped: one pull request per ecosystem and directory each week.
#
# The titles use a conventional-commit prefix because `PR title` (semantic-pull-requests.yml) is a required check: Dependabot's default "Bump x from a to b" would fail it.
#
# Not covered, on purpose:
# - npm: the workspace runs pnpm 11 (package.json's packageManager), and Dependabot's documented pnpm support stops at v10. Revisit when it lists pnpm 11, and check then that it rewrites the `catalog:` entries in pnpm-workspace.yaml, where every shared version lives.
# - docker (the Dockerfiles): deploy/docker/Dockerfile and apps/website/Dockerfile take every base image from an ARG default (`FROM ${NODE_IMAGE}`), which Dependabot does not resolve (dependabot/dependabot-core#2057), so the ecosystem would find nothing to update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /apps/server
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-modules:
        patterns:
          - "*"

  # docker-compose.dev.yml (the local and CI stack) and deploy/docker/docker-compose.yml (self-hosting); Dependabot reads an image's `${VAR:-default}` default as its version.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      compose-images:
        patterns:
          - "*"
