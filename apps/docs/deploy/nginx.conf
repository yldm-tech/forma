server {
    listen 8080;
    server_name _;

    # Mintlify exports a directory per page with an index.html inside, so `/docs/a/b` has to resolve
    # to `/docs/a/b/index.html`. Without the second try_target every page but the root 404s.
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects. nginx's directory redirect otherwise sends the client to the container's
    # own `host:8080`, which is not reachable from a browser once this sits behind an ingress —
    # `/docs/a/b` would answer 301 to `http://127.0.0.1:8080/docs/a/b/` and the navigation dies.
    absolute_redirect off;
    port_in_redirect off;

    # Hashed filenames, so they can be cached hard. Everything else is HTML that changes with the
    # content and must not be.
    location /docs/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /docs/ {
        try_files $uri $uri/ $uri/index.html /docs/404/index.html =404;
    }

    # Serving nothing outside /docs is deliberate: the app owns every other path on this host, and
    # a catch-all here would answer for routes that are not this service's to answer.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
