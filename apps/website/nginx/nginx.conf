# The image's main nginx configuration, replacing the base image's so that nothing is written outside /tmp: the pid file and every temp path live there, logs go to the container's stdout and stderr. With /tmp mounted writable (an emptyDir), the container runs as a non-root user on a read-only root filesystem.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml image/x-icon;

    include /etc/nginx/conf.d/*.conf;
}
