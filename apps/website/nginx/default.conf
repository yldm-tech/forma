# The website on forma.yldm.ai: every path the ingress does not send to the Go server (/app, the survey pages, the APIs, /js, ...). Pages are directories with an index.html (/zh/form-builder/index.html), every page URL ends in a slash, and an unknown path gets the 404 page of the locale its prefix names.

# Hashed build output is immutable; the other files under /_site/ (icons, share images) keep their names across releases and are cached for a day; HTML is revalidated on every request so a release shows at once. HTML also says no-transform, so Cloudflare does not inject its Web Analytics beacon, which the Content-Security-Policy below blocks; no-transform also stops Cloudflare from compressing a response, so the cached files and the plain-text health check never get it.
map $uri $website_cache_control {
    ~^/_site/assets/      "public, max-age=31536000, immutable";
    ~^/_site/             "public, max-age=86400";
    ~\.(ico|txt|xml)$     "public, max-age=3600";
    /healthz              "no-cache";
    default               "no-cache, no-transform";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Relative redirects: behind the ingress, nginx's own host and port (127.0.0.1:8080) are not reachable from a browser, so /zh must redirect to /zh/, not to http://127.0.0.1:8080/zh/.
    absolute_redirect off;
    port_in_redirect off;

    # Set here once and never in a location: an add_header inside a location would silently drop every one of these for that location. `always` keeps them on 404s and redirects too.
    add_header Cache-Control $website_cache_control always;
    # The value the Go server sends on /app and the survey pages (httpserver securityHeaders), so the root, the address most visitors type, pins HTTPS for the whole host as well. Browsers ignore it on a plain-HTTP response; Cloudflare terminates TLS in front of this server.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # The pages run one same-origin module script and no inline script or style (the JSON-LD block is data, which CSP does not govern). WebGL needs nothing beyond 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Inbound links the site keeps working: /signup, /github, /discord, /open-source-form-builder. Generated at build time from src/site.ts.
    include /etc/nginx/website/redirects.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # `$uri/` makes nginx answer a directory without its slash (/zh/form-builder) with a 301 to the slashed URL, so each page has one address.
    location /zh/ {
        error_page 404 /zh/404.html;
        try_files $uri $uri/ =404;
    }

    location /ja/ {
        error_page 404 /ja/404.html;
        try_files $uri $uri/ =404;
    }

    # Assets are files only: a directory below /_site/, with or without its trailing slash (/_site/assets/, /_site/assets), is a plain 404 through the no-cache 404 page, never a directory redirect or a 403 that would pick up the year-long Cache-Control of the files below it.
    location /_site/ {
        error_page 404 /404.html;
        # try_files treats a trailing slash as a directory check, which an existing directory passes on to the index module and its 403.
        location ~ /$ {
            return 404;
        }
        try_files $uri =404;
    }

    location / {
        error_page 404 /404.html;
        try_files $uri $uri/ =404;
    }
}
