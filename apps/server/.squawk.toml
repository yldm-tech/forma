# Squawk configuration for the goose migrations in apps/server/migrations, ported from forma2's packages/database/.squawk.toml. tooling/scripts/lint-migrations.sh runs it on the migrations a change adds or edits; shipped migrations are never edited, so they are never linted.

# PostgreSQL 18 is the lowest version the schema runs on (uuidv7()).
pg_version = "18.0"

# Not set here: goose runs each migration in a transaction unless the file says `-- +goose NO TRANSACTION`, so tooling/scripts/lint-migrations.sh passes --assume-in-transaction per file.

excluded_rules = [
  # Counts, limits and positions are integer columns by design; none of them approaches 2^31.
  "prefer-bigint-over-int",
  # Safe statement timeouts depend on the operation and the table's size; a global value can abort valid migrations.
  "require-statement-timeout",
]
