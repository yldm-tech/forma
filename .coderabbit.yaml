chat:
  art: true
  # Public repo: only org members may drive the bot with commands. Outside PRs are
  # still reviewed automatically — this only stops non-members invoking
  # `@coderabbitai` at all. The autofix and fix_ci write recipes are off above, so
  # this is defence in depth rather than the thing keeping them out of reach.
  allow_non_org_members: false
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns: []
  learnings:
    scope: auto
    # Not 0. A learning is a durable review rule, and at 0 it applies immediately —
    # unversioned, unreviewed, and settable by anyone who replies to the bot. That is
    # the same failure this file exists to end. Seven days give an admin time to reject
    # one. `scope: auto` resolves to local on a public repo, so it stays in this repo.
    approval_delay: 7
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys: []
    excluded_project_keys: []
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto
  mcp:
    usage: auto
    disabled_servers: []
  automatic_repository_linking: false
  linked_repositories: []

code_generation:
  docstrings:
    language: en-US
    path_instructions: []
  unit_tests:
    path_instructions: []

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels: []
  labeling:
    labeling_instructions: []
    auto_apply_labels: false
