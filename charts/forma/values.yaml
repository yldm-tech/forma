# Override the name for the application.
# If not set, the chart name will be used.
nameOverride: ""

# Override the name of the application component.
# Defaults to the same value as nameOverride.
componentOverride: ""

# Override the application "part-of" label.
# Defaults to the chart name if not set.
partOfOverride: ""

##########################################################
# Forma Configuration
##########################################################
forma:
  # REQUIRED: Base URL of the site (e.g., https://forma.example.com)
  # This is used for WEBAPP_URL and NEXTAUTH_URL
  webappUrl: ""

  # Optional: Public URL for surveys (defaults to webappUrl if not set)
  publicUrl: ""

  # Optional: where /api/mcp fetches the keys OAuth access tokens are signed with (MCP_OAUTH_JWKS_URL), for verifying against another instance's authorization server. Leave empty to read them from the database this release's authorization server writes them to. The issuer and token audience stay derived from webappUrl either way.
  mcpOauthJwksUrl: ""

##########################################################
# Database Migration Job Configuration Helm
##########################################################
migration:
  # Enable the migration job (`forma migrate`). In Argo CD, it runs as a Sync hook in wave -1 after chart-managed secrets and bundled PostgreSQL are healthy. When enabled, the server skips its startup migration (SKIP_STARTUP_MIGRATION=true); when disabled, every server pod migrates as it starts, taking turns through a PostgreSQL advisory lock.
  enabled: true

  # Additional annotations for the migration job
  annotations: {}

  # Time to keep the job after completion (seconds)
  ttlSecondsAfterFinished: 300

  # Number of retries before marking the job as failed
  backoffLimit: 3

  # Wait for the effective migration database endpoint before starting migrations (`forma wait-for-database`). MIGRATE_DATABASE_URL takes precedence over DATABASE_URL, matching `forma migrate`.
  waitForDatabase:
    enabled: true
    timeoutSeconds: 900
    intervalSeconds: 5
    connectionTimeoutSeconds: 5

  # Resource requests and limits for the migration job
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
      cpu: "100m"

##########################################################
# Deployment Configuration
##########################################################
deployment:
  # Deployment strategy configuration
  strategy:
    type: RollingUpdate # Type of deployment strategy (RollingUpdate/Recreate)
    # rollingUpdate:
    #   maxSurge: 25%
    #   maxUnavailable: 25%

  # Time Kubernetes allows the Pod to stop gracefully
  # Must exceed any preStop drain below because lifecycle hooks run inside this budget
  terminationGracePeriodSeconds: 30

  # Optional app container lifecycle hooks
  lifecycle: {}
  # Native sleep requires Kubernetes >= 1.29; use an exec handler on older clusters
  #   preStop:
  #     sleep:
  #       seconds: 20

  # Automatically reload deployment when ConfigMaps or Secrets change
  reloadOnChange: false

  # NodeSelector for scheduling pods on specific nodes
  nodeSelector: {}

  # Additional labels for Deployment
  additionalLabels: {}

  # Additional pod labels to be used in the Service's label selector
  additionalPodLabels: {}

  # Deployment annotations
  annotations: {}

  # Additional pod annotations
  additionalPodAnnotations: {}

  # Number of replicas when autoscaling is disabled
  replicas: 1

  # Image pull secrets for private container registries
  imagePullSecrets: ""

  # Environment variables from ConfigMaps or Secrets
  envFrom:
    # app-secrets:
    #   type: secret
    #   nameSuffix: app-secrets

  # Environment variables passed to the server and worker containers (and DATABASE_URL / MIGRATE_DATABASE_URL to the Jobs).
  # Booleans are 1 or 0: the Go server refuses forma2's true/false spelling except for SKIP_STARTUP_MIGRATION.
  # For self-hosted Qwen/vLLM AI, set only the OpenAI-compatible variables you need, for example:
  # AI_PROVIDER: openai-compatible
  # AI_MODEL: qwen3-14b-awq
  # AI_OPENAI_COMPATIBLE_BASE_URL: http://vllm:8000/v1
  # AI_OPENAI_COMPATIBLE_PROVIDER_NAME: vllm
  # AI_OPENAI_COMPATIBLE_SUPPORTS_STRUCTURED_OUTPUTS: "1"
  # Secret values can use valueFrom.secretKeyRef; omit unused provider variables.
  env:
    # The app sits behind exactly one reverse proxy (Traefik/Envoy) in this chart, so the client address
    # is the last X-Forwarded-For entry. Pinned here rather than relying on the code default (also 1) so
    # the assumption is visible next to the ingress it describes. Raise it if you put further proxies —
    # a CDN, a corporate load balancer — in front of the ingress; setting it higher than the real chain
    # lets callers spoof their address by prepending entries.
    TRUSTED_PROXY_HOP_COUNT: "1"

  # Additional pod volumes and app container mounts. These are useful for custom CA bundles and
  # provider-specific runtime files without placing their contents directly in Helm values.
  extraVolumes: []
  extraVolumeMounts: []

  # Tolerations for scheduling pods on tainted nodes
  tolerations: []

  # Pod affinity and anti-affinity rules
  affinity: {}

  # Topology spread constraints for better scheduling
  topologySpreadConstraints: []

  # Number of previous ReplicaSet versions to retain
  revisionHistoryLimit: 2

  # Application container image
  image:
    repository: "ghcr.io/yldm-tech/forma"
    tag: "" # Defaults to appVersion if not set; pin the release you deploy
    digest: "" # If set, digest takes precedence over the tag
    pullPolicy: IfNotPresent

  # Health probes configuration. The two HTTP paths answer different questions and must not be aliased:
  # /health is a static handler that says the process is serving HTTP, which is the only thing liveness may
  # act on — restarting pods because Postgres is down turns a dependency outage into a crash loop. Readiness
  # uses /health/ready, which queries Postgres and returns 503 when it cannot be reached, so a rollout whose
  # new pods have the wrong DATABASE_URL, a rotated credential, or an unapplied NetworkPolicy never goes
  # Ready and the old pods keep serving. It stays scoped to Postgres on purpose: Redis and SpiceDB outages
  # would drain every replica out of the Service for dependencies the pod can still degrade around.
  probes:
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
      tcpSocket:
        port: 3000

    readinessProbe:
      failureThreshold: 5
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 5
      initialDelaySeconds: 10
      httpGet:
        path: /health/ready
        port: 3000

    livenessProbe:
      failureThreshold: 5
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 5
      initialDelaySeconds: 10
      httpGet:
        path: /health
        port: 3000

  # Resource requests and limits
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 1Gi
      cpu: "1"

  # Container security context of the server and worker containers. The image runs as uid 1001 (USER 1001:1001 in the repository's Dockerfile), which runAsUser pins so kubelet can enforce runAsNonRoot. readOnlyRootFilesystem stays off because large multipart uploads spill to /tmp; turning it on needs an emptyDir mounted at /tmp through deployment.extraVolumes / deployment.extraVolumeMounts.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: false
    seccompProfile:
      type: RuntimeDefault

  # Pod security context
  securityContext: {}

  # Command override
  command: []

  # Arguments override. Empty runs the image's default, `forma start`, which serves after the switches above (SKIP_STARTUP_MIGRATION, BULLMQ_WORKER_ENABLED) say what else to do.
  args: []

  # Container ports
  ports:
    http:
      containerPort: 3000
      protocol: TCP
      exposed: true
    # The Prometheus exporter, listening only when PROMETHEUS_ENABLED=1 (set automatically with the ServiceMonitor). The worker gets the same port.
    metrics:
      containerPort: 9464
      protocol: TCP
      exposed: true

##########################################################
# Job worker (`forma worker`)
##########################################################
worker:
  # Run the background jobs (response pipeline, webhooks, emails, integrations, workflows, SpiceDB projection, periodic tasks) in a Deployment of their own. It uses the server's image, envFrom, env, security contexts, volumes and pull secrets. Disabled, the server pods run the jobs in-process, as forma2's did.
  enabled: true

  replicas: 1

  # SHUTDOWN_TIMEOUT (20 s by default) for running jobs to finish, plus 10 s for cancelled ones to return, plus margin.
  terminationGracePeriodSeconds: 40

  strategy: {}

  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 256Mi
      cpu: 250m

  additionalLabels: {}
  annotations: {}

  # Default to deployment.nodeSelector / deployment.tolerations when empty. Affinity and spread constraints are not inherited, since they usually select the server's pod labels.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

##########################################################
# Optional bundled web LLM runtime
##########################################################
llm:
  # Deploy Forma-provided Qwen through the vLLM OpenAI-compatible runtime.
  # Disabled by default; keep using deployment.env for Google Vertex, Azure, Bedrock,
  # or externally managed OpenAI-compatible providers.
  enabled: false

  # When enabled, automatically points the Forma app at the bundled vLLM router.
  # Any AI_* value explicitly set in deployment.env takes precedence over these defaults.
  autoConfigureApp: true

  # Forma app-facing settings for the bundled runtime.
  forma:
    # Defaults to http://<release-name>-router-service:<llm.routerSpec.servicePort>/v1 when empty.
    baseUrl: ""
    model: qwen3-14b-awq
    providerName: vllm
    supportsStructuredOutputs: "1"

  servingEngineSpec:
    enableEngine: true
    labels:
      environment: llm
      release: vllm
    imagePullPolicy: IfNotPresent
    servicePort: 8000
    runtimeClassName: ""
    strategy:
      type: Recreate
    modelSpec:
      - name: qwen
        enabled: true
        repository: vllm/vllm-openai
        tag: v0.14.0
        modelURL: Qwen/Qwen3-14B-AWQ
        replicaCount: 1
        requestCPU: 4
        requestMemory: 24Gi
        limitCPU: 8
        limitMemory: 32Gi
        requestGPU: 1
        requestGPUType: nvidia.com/gpu
        pvcStorage: 100Gi
        runtimeClassName: ""
        shmSize: 8Gi
        vllmConfig:
          maxModelLen: 8192
          dtype: float16
          tensorParallelSize: 1
          maxNumSeqs: 8
          gpuMemoryUtilization: 0.9
          extraArgs:
            - --served-model-name
            - qwen3-14b-awq
            - --default-chat-template-kwargs
            - '{"enable_thinking": false}'
        lmcacheConfig:
          enabled: false
        keda:
          enabled: false
    startupProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 180
      httpGet:
        path: /health
        port: 8000
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8000
    readinessProbe:
      initialDelaySeconds: 15
      periodSeconds: 10
      failureThreshold: 12
      httpGet:
        path: /health
        port: 8000

  routerSpec:
    enableRouter: true
    imagePullPolicy: IfNotPresent
    serviceType: ClusterIP
    servicePort: 8000
    serviceDiscovery: k8s
    k8sServiceDiscoveryType: service-name
    resources:
      requests:
        cpu: 400m
        memory: 1Gi
      limits:
        memory: 2Gi
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 120
      httpGet:
        path: /health
        port: router-port
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
      httpGet:
        path: /health
        port: router-port
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 30
      httpGet:
        path: /health
        port: router-port
autoscaling:
  enabled: true # Enable/disable HPA
  additionalLabels: {} # Additional labels for the HPA resource
  annotations: {} # Annotations for HPA
  minReplicas: 1 # Minimum number of replicas
  maxReplicas: 10 # Maximum number of replicas
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 minutes before scaling down to prevent thrashing
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120 # Remove at most 1 pod every 2 minutes
    scaleUp:
      stabilizationWindowSeconds: 60 # Wait 1 minute before scaling up
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60 # Add at most 2 pods every minute

##########################################################
# Pod Disruption Budget (PDB)
#
# Ensures a minimum number of pods remain available during
# voluntary disruptions (node drains, cluster upgrades, etc.).
#
# IMPORTANT:
#   - minAvailable and maxUnavailable are MUTUALLY EXCLUSIVE.
#     Setting both will cause a helm install/upgrade failure.
#     To switch, set the unused one to null in your override file.
#   - Accepts an integer (e.g., 1) or a percentage string (e.g., "25%").
#   - For PDB to provide real HA protection, ensure
#     autoscaling.minReplicas >= 2 (or deployment.replicas >= 2
#     if HPA is disabled). With only 1 replica and minAvailable: 1,
#     the PDB will block ALL node drains and cluster upgrades.
##########################################################
pdb:
  enabled: true
  additionalLabels: {}
  annotations: {}

  # Minimum pods that must remain available during disruptions.
  # Set to null and configure maxUnavailable instead if preferred.
  minAvailable: 1

  # Maximum pods that can be unavailable during disruptions.
  # Mutually exclusive with minAvailable — uncomment and set
  # minAvailable to null to use this instead.
  # maxUnavailable: 1

  # Eviction policy for unhealthy pods (Kubernetes 1.27+).
  # "IfHealthy"    — unhealthy pods count toward the budget (default).
  # "AlwaysAllow"  — unhealthy pods can always be evicted,
  #                  preventing them from blocking node drain.
  # unhealthyPodEvictionPolicy: AlwaysAllow

##########################################################
# Service Configuration
##########################################################
service:
  enabled: true # Enable/disable Kubernetes Service
  additionalLabels: {} # Additional labels for Service
  annotations: {} # Annotations for Service
  type: ClusterIP # Service type (ClusterIP, NodePort, LoadBalancer)
  ports: [] # Additional ports

##########################################################
# Role-Based Access Control (RBAC)
##########################################################
rbac:
  enabled: false # Enable/disable RBAC
  serviceAccount:
    enabled: false # Enable/disable ServiceAccount
    name: "" # Custom ServiceAccount name
    additionalLabels: {} # Additional labels
    annotations: {} # Annotations

##########################################################
# Kubernetes Secret Configuration (Quick Start)
##########################################################
secret:
  enabled: true

##########################################################
# External Secrets Configuration
##########################################################
externalSecret:
  enabled: false # Enable/disable ExternalSecrets
  secretStore:
    name: aws-secrets-manager # Secret store reference name
    kind: ClusterSecretStore # Type of secret store
  refreshInterval: "1h" # Frequency of secret sync
  files: {}

##########################################################
# AuthZed / SpiceDB Authorization Configuration
##########################################################
authzed:
  # Forma v6 uses SpiceDB as its sole authorization decision engine.
  enabled: true

  # Existing releases must complete the documented schema/backfill/audit preparation before their
  # first v6 Helm upgrade. Fresh installs do not need to set this value.
  migrationAcknowledged: false

  initialization:
    # Fresh self-hosted installs run the release-matched schema and relationship preparation Job.
    # Set this to false only when an operator performs the same guarded cutover externally, and set
    # migrationAcknowledged=true only after that preparation has completed successfully.
    enabled: true

  # selfHosted creates a SpiceDBCluster. external only configures the app client.
  mode: selfHosted

  # grpc:// is intentionally omitted. AuthZed SDKs accept host:port endpoints.
  # For selfHosted mode this defaults to forma-spicedb:50051.
  endpoint: ""
  # null selects the safe mode-specific default: plaintext for the internal
  # selfHosted service and TLS for external endpoints. Set true explicitly only
  # when an external endpoint intentionally accepts plaintext gRPC.
  insecure: null
  consistency: fully_consistent

  auth:
    # Secret must contain tokenKey. When empty in selfHosted mode, the chart
    # creates a stable secret and reuses it across Helm upgrades.
    existingSecret: ""
    tokenKey: preshared_key

  datastore:
    # Production deployments should provision a dedicated database and role,
    # then expose its URI through this secret. The secret may be the same as auth.existingSecret.
    existingSecret: ""
    uriKey: datastore_uri

  cluster:
    name: ""
    version: v1.52.0
    channel: stable
    replicas: 2
    config:
      datastoreEngine: postgres
      logLevel: info
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # Operator patches are applied after the generated resource patch and can
    # override it when a deployment needs more specific container settings.
    patches: []

  # Creates the dedicated `spicedb` database and role only when the bundled
  # PostgreSQL dependency is enabled and no datastore secret is supplied.
  bundledPostgresqlBootstrap:
    enabled: true
    image: postgres:17-alpine
    backoffLimit: 10
    # The administrative role the bootstrap Job connects as to create the
    # dedicated `spicedb` role and database. It needs CREATEROLE and CREATEDB,
    # not necessarily superuser.
    #
    # CREATE DATABASE ... OWNER also requires being able to SET ROLE to the
    # owner, which CREATEROLE alone does not give, so the Job grants itself the
    # `spicedb` role first. From PostgreSQL 16 that works only for a role it
    # holds ADMIN OPTION on — which creating the role confers, so the only
    # unsupported case is a `spicedb` role someone else already created. See the
    # chart README.
    #
    # Defaults to the `postgres` superuser the bundled subchart creates. An
    # existing PostgreSQL that was installed without one (see
    # postgresql.auth.enablePostgresUser) would otherwise fail this Job, so point
    # these at whichever role does hold those privileges instead of disabling
    # bootstrap wholesale.
    adminUsername: postgres
    adminDatabase: postgres
    # Where that role's password lives. Both default to the bundled PostgreSQL
    # admin credentials, so overriding adminUsername alone is not enough — set
    # these too whenever the role is not the bundled `postgres` superuser.
    # Setting the name without the key is refused as well: the key would
    # otherwise fall back to the subchart's own key name and be looked up inside
    # your Secret, which fails only once the Pod is created.
    adminPasswordSecretName: ""
    adminPasswordKey: ""

  # Cloud installations can bootstrap a dedicated database on an existing
  # PostgreSQL server. The admin Secret is read only by the short-lived Job.
  # Its URL must explicitly set sslmode=require, verify-ca, or verify-full.
  externalPostgresqlBootstrap:
    enabled: false
    image: postgres:17-alpine
    backoffLimit: 10
    adminSecretName: ""
    adminUrlKey: DATABASE_URL
    databaseNameKey: database_name
    databaseUsernameKey: database_username
    databasePasswordKey: database_password

  # Install one operator per cluster. Disable this when a shared operator
  # already watches the Forma namespace (the Forma Cloud topology).
  operator:
    # Breaking in v6: the default changed from false to true. Existing clusters with a compatible
    # shared operator must keep this false to prevent two operators reconciling the same cluster.
    # Set false when a compatible cluster-wide operator already watches this namespace.
    install: true

# Values passed to the bundled spicedb-operator dependency when
# authzed.operator.install=true.
spicedbOperator:
  watchNamespaces: []
  serviceMonitor:
    enabled: false

##########################################################
# Ingress Configuration
##########################################################
ingress:
  enabled: false # Enable/disable Ingress
  ingressClassName: alb # Specify the Ingress class
  hosts:
    - host: k8s.forma.ylam.ai
      paths:
        - path: /
          pathType: "Prefix"
          serviceName: "forma"
  annotations: {} # Ingress annotations

##########################################################
# Envoy Gateway Bundle
##########################################################
envoy:
  # Enable app-bound Envoy resources (Gateway, HTTPRoutes, policies, ingress)
  enabled: false

  # Install the Envoy Gateway controller from this chart when true.
  # Leave disabled when the cluster already provides a compatible controller.
  controller:
    enabled: false

  createNamespace: false

  deployment:
    replicas: 1
    envoyGateway:
      resources:
        limits:
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 256Mi
      pod:
        topologySpreadConstraints: []
        tolerations: []
        nodeSelector: {}
    ports:
      - name: grpc
        port: 18000
        targetPort: 18000
      - name: ratelimit
        port: 18001
        targetPort: 18001
      - name: wasm
        port: 18002
        targetPort: 18002
      - name: metrics
        port: 19001
        targetPort: 19001

  service:
    type: ClusterIP
    annotations: {}

  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/forma-envoy-controller
      provider:
        type: Kubernetes
        kubernetes:
          deploy:
            type: GatewayNamespace
          rateLimitDeployment:
            replicas: 1
            container:
              env:
                - name: CACHE_KEY_PREFIX
                  value: "forma:"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
      logging:
        level:
          default: info
          global-ratelimit: info
      rateLimit:
        backend:
          type: Redis
          redis:
            # Override this when enabling envoyRedis auth or changing envoyRedis.fullnameOverride.
            url: "forma-envoy-redis-master:6379"
        failClosed: false
        telemetry:
          metrics:
            prometheus:
              disable: false
      envoyProxy:
        logging:
          level:
            default: info
        preserveRouteOrder: true

  forma:
    gatewayClass:
      create: true
      # Required when create=false so the Gateway can bind to an existing cluster-scoped GatewayClass.
      name: ""
    gateway:
      name: ""
      listenerName: http
      port: 80
    proxy:
      name: ""
      replicas: 1
      service:
        name: ""
        type: ClusterIP
        annotations: {}
      logging:
        defaultLevel: info
      telemetry:
        prometheus:
          enabled: true
        openTelemetry:
          enabled: false
          # Prefer host/port when the collector Service lives in another namespace.
          host: ""
          port: 4317
          serviceName: ""
          serviceNamespace: ""
          deploymentEnvironment: ""
          # Use backendRefs only when you intentionally want Service discovery through Gateway API refs.
          backendRefs: []
    clientTrafficPolicy:
      enabled: true
      numTrustedHops: 2
    ingress:
      enabled: false
      ingressClassName: ""
      # Set this explicitly when both the main app ingress and the Envoy API ingress are enabled.
      host: ""
      annotations: {}
    routes:
      authCallback: true
      v1Client: true
      v2Client: true
      v1Management: true
      v1Webhooks: true
      storage: true
    policies:
      enabled: false
      authCallback: true
      v1Client: true
      v2Client: true
      v1Management: true
      v1Webhooks: true
      storage: true

##########################################################
# Dedicated Redis for Envoy Rate Limiting
##########################################################
envoyRedis:
  enabled: false
  fullnameOverride: "forma-envoy-redis"
  # Only affects the bundled envoy Redis release.
  # If you point Envoy rate limiting at an external Redis/Valkey instance instead,
  # configure that deployment separately with `maxmemory-policy noeviction`.
  architecture: replication
  rbac:
    create: true
  serviceAccount:
    create: true
    automountServiceAccountToken: true
  auth:
    enabled: false
  commonConfiguration: |-
    appendonly yes
    save ""
  networkPolicy:
    enabled: false
  master:
    resources: {}
    podAntiAffinityPreset: soft
    topologySpreadConstraints: []
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    pdb:
      create: true
      maxUnavailable: 1
  replica:
    replicaCount: 2
    automountServiceAccountToken: true
    resources: {}
    podAntiAffinityPreset: soft
    topologySpreadConstraints: []
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    pdb:
      create: true
      maxUnavailable: 1
  sentinel:
    enabled: true
    quorum: 2
    masterSet: formaenvoy
    getMasterTimeout: 90
    automateClusterRecovery: false
    redisShutdownWaitFailover: true
    resources: {}
    persistence:
      enabled: false
    service:
      type: ClusterIP
    masterService:
      enabled: true
      type: ClusterIP
  metrics:
    enabled: false

##########################################################
# Valkey Configuration
##########################################################
redis:
  enabled: true # Enable/disable bundled Valkey
  # Use this to point Forma's rate limits and short-lived state at an existing Redis/Valkey deployment. The job queue no longer lives here (it is in PostgreSQL), but keep `maxmemory-policy noeviction` and a `maxmemory` below the host's memory ceiling, as for the bundled instance.
  externalRedisUrl: ""
  fullnameOverride: "forma-redis"
  image:
    repository: "valkey/valkey"
    tag: ""
    digest: "sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84"
    pullPolicy: IfNotPresent
  architecture: standalone
  # `maxmemory` must stay set, and must stay well under `redis.master.resources.limits.memory` below. Without it Valkey has no ceiling of its own and simply grows until the kernel OOM-kills the container, which drops whatever state sits outside the AOF fsync window and then replays into the same wall. 256mb is half of the 512Mi limit rather than the more usual 70%: `appendonly yes` means an AOF rewrite forks the server, and copy-on-write during that rewrite can add most of the dataset again to RSS, on top of the ~10MB baseline. Raising the limit means raising this line with it.
  #
  # The sizing was set for forma2's BullMQ job retention. The Go server keeps its job queue in PostgreSQL (River), so this instance now holds only rate-limit counters and short-lived state, far below 256mb; the values are kept so an upgrade does not resize the StatefulSet.
  #
  # `noeviction` stays: an LRU policy could silently evict a rate-limit window or a lock. Reaching `maxmemory` fails writes while reads keep serving, a recoverable state, unlike an OOM kill.
  commonConfiguration: |-
    appendonly yes
    save ""
    maxmemory 256mb
    maxmemory-policy noeviction
  auth:
    enabled: true
    existingSecret: "forma-app-secrets"
    existingSecretPasswordKey: "REDIS_PASSWORD"
  networkPolicy:
    enabled: false
  master:
    resources:
      limits:
        cpu: 150m
        # Sized with the `maxmemory` line in commonConfiguration. Change the two together; charts/forma/tests/redis-memory-limits.sh fails if the ceiling ever stops being comfortably below the limit the kernel enforces.
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    podSecurityContext: {}
    containerSecurityContext: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    pdb:
      enabled: true
      minAvailable: ""
      maxUnavailable: 0

##########################################################
# Service Monitor to collect Prometheus metrices
##########################################################
serviceMonitor:
  # Only rendered where the Prometheus Operator CRD exists. Enabling it is also what turns on the Prometheus exporter of the server and the worker: both get PROMETHEUS_ENABLED=1 under the same condition, so the scrape target and the listener cannot drift apart, and the worker gets a headless metrics Service for the job metrics. Overriding PROMETHEUS_ENABLED in deployment.env wins over that default.
  enabled: true

  # Additional labels
  additionalLabels:
  # key: value

  # Additional annotations
  annotations:
  # key: value

  # List of the endpoints of service from which prometheus will scrape data. 30s matches the Prometheus
  # default; the previous 5s scraped every pod six times as often — up to 10 pods at autoscaling.maxReplicas
  # — for metrics whose slowest-moving members (the forma_authzed_* outbox gauges) move far more slowly.
  endpoints:
    - interval: 30s
      path: /metrics
      port: metrics
postgresql:
  enabled: true # Enable/disable PostgreSQL
  externalDatabaseUrl: ""
  # Argo CD waits for bundled PostgreSQL before running migration hooks in wave -1.
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "-2"
  global:
    security:
      allowInsecureImages: true
  fullnameOverride: "forma-postgresql"
  # PostgreSQL 18 or newer: the schema uses uuidv7(). forma2's chart ran pg17, whose data directory PostgreSQL 18 cannot open, so an upgrade over a release still running another major is refused until its data has been moved (README: Upgrading the bundled PostgreSQL from 17 to 18).
  image:
    repository: pgvector/pgvector
    tag: pg18
  # Set to true once the databases of a release whose bundled PostgreSQL ran another major version have been dumped and restored onto a fresh volume.
  majorUpgradeAcknowledged: false
  auth:
    # The bundled AuthZed bootstrap creates a dedicated role and database and
    # therefore requires the PostgreSQL administrator account.
    enablePostgresUser: true
    username: forma
    database: forma
    existingSecret: "forma-app-secrets"
    secretKeys:
      adminPasswordKey: "POSTGRES_ADMIN_PASSWORD"
      userPasswordKey: "POSTGRES_USER_PASSWORD"
  primary:
    networkPolicy:
      enabled: false
    persistence:
      enabled: true
      size: 10Gi
    # The upstream nano preset leaves too little memory headroom when the
    # bundled database also serves SpiceDB. Helm cannot condition dependency
    # values on authzed.enabled, so retain the live-validated safe baseline.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      runAsUser: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      readOnlyRootFilesystem: false
