{{- if and (.Values.secret) (.Values.secret.enabled) }}

{{- $postgresAdminPassword := include "forma.postgresAdminPassword" . }}
{{- $postgresUserPassword := include "forma.postgresUserPassword" . }}
{{- $redisPassword := "" }}
{{- if and .Values.redis.enabled .Values.redis.auth.enabled }}
{{- $redisPassword = include "forma.redisPassword" . }}
{{- end }}
{{- $webappUrl := required "forma.webappUrl is required. Set it to your Forma instance URL (e.g., https://forma.example.com)" .Values.forma.webappUrl }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forma.appSecretName" . }}
  labels:
    {{- include "forma.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  # Forma application URLs
  WEBAPP_URL: {{ $webappUrl | b64enc }}
  NEXTAUTH_URL: {{ $webappUrl | b64enc }}
  {{- if .Values.forma.publicUrl }}
  PUBLIC_URL: {{ .Values.forma.publicUrl | b64enc }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.auth.enabled }}
  REDIS_URL: {{ printf "redis://:%s@%s:6379" $redisPassword (include "forma.redisMasterName" .) | b64enc }}
  {{- else if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s:6379" (include "forma.redisMasterName" .) | b64enc }}
  {{- else }}
  REDIS_URL: {{ .Values.redis.externalRedisUrl | b64enc }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql://forma:%s@forma-postgresql/forma" $postgresUserPassword | b64enc }}
  {{- else }}
  DATABASE_URL: {{ .Values.postgresql.externalDatabaseUrl | b64enc }}
  {{- end }}
  CRON_SECRET: {{ include "forma.cronSecret" . | b64enc }}
  ENCRYPTION_KEY: {{ include "forma.encryptionKey" . | b64enc }}
  NEXTAUTH_SECRET: {{ include "forma.nextAuthSecret" . | b64enc }}
  {{- if and (.Values.enterprise.licenseKey) (ne .Values.enterprise.licenseKey "") }}
  ENTERPRISE_LICENSE_KEY: {{ .Values.enterprise.licenseKey | b64enc }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.auth.enabled }}
  REDIS_PASSWORD: {{ $redisPassword | b64enc }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_ADMIN_PASSWORD: {{ $postgresAdminPassword | b64enc }}
  POSTGRES_USER_PASSWORD: {{ $postgresUserPassword | b64enc }}
  {{- end }}
{{- end }}
